name: Bootstrap stable source and release
on:
  push:
    paths: ['.bootstrap/payload.b64']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract verified source archive
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, io, lzma, tarfile
          root = Path.cwd().resolve()
          encoded = (root / ".bootstrap/payload.b64").read_text().strip()
          archive = lzma.decompress(base64.b64decode(encoded, validate=True))
          with tarfile.open(fileobj=io.BytesIO(archive), mode="r:") as tf:
              for member in tf:
                  if not member.isfile():
                      continue
                  dest = (root / member.name).resolve()
                  if not dest.is_relative_to(root):
                      raise RuntimeError("Unsafe archive path: " + member.name)
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(tf.extractfile(member).read())
          PY
          rm -rf .bootstrap .github/workflows/bootstrap.yml
      - name: Validate IINA package
        run: |
          python3 tests/test_release.py
          node --check main.js
      - name: Publish readable source and tag
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: Audio Float for IINA v1.0.0 stable'
          git push origin HEAD:main
          git tag -a v1.0.0 -m 'Audio Float for IINA v1.0.0 stable'
          git push origin v1.0.0
      - name: Publish installable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.0 dist/Audio-Float-for-IINA-v1.0.0.iinaplgz --title 'Audio Float for IINA v1.0.0' --notes-file CHANGELOG.md --verify-tag
