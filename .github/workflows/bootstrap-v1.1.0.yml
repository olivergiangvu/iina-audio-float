name: Publish Audio Float v1.1.0 Stable
on:
  push:
    paths:
      - '.bootstrap/ready.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and restore stable source changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib
          root = Path.cwd()
          parts = sorted((root / '.bootstrap').glob('part-*.txt'))
          if len(parts) != 5:
              raise RuntimeError(f'Expected five release patch chunks, got {len(parts)}')
          payload = base64.b64decode(''.join(p.read_text().strip() for p in parts),validate=True)
          digest = hashlib.sha256(payload).hexdigest()
          if digest != '1ad085fe6441e18bf69239572bb9e3da5c6c15b8cbbf8b1f2e026b2b77328b99':
              raise RuntimeError(f'Release patch checksum mismatch: {digest}')
          Path('/tmp/audio-float-v1.1.0.br').write_bytes(payload)
          PY
          node -e "const fs=require('fs'),z=require('zlib');fs.writeFileSync('/tmp/audio-float-v1.1.0.patch',z.brotliDecompressSync(fs.readFileSync('/tmp/audio-float-v1.1.0.br')))"
          git apply --check /tmp/audio-float-v1.1.0.patch
          git apply /tmp/audio-float-v1.1.0.patch
          rm -rf .bootstrap
      - name: Test stable source and create package
        run: |
          python3 tests/test_release.py
          node --check main.js
          node tests/test_hit_test_guard.js
          node tests/test_theme_preference.js
          python3 - <<'PY'
          import json
          d=json.load(open('Info.json'))
          assert d['version']=='1.1.0'
          assert d['ghVersion']==4
          PY
      - name: Commit to main and push tag
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: Audio Float v1.1.0 stable with System appearance'
          git push origin HEAD:main
          git tag -a v1.1.0 -m 'Audio Float v1.1.0 stable'
          git push origin v1.1.0
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.1.0 dist/Audio-Float-for-IINA-v1.1.0.iinaplgz --title 'Audio Float for IINA v1.1.0' --notes-file CHANGELOG.md --verify-tag --latest
